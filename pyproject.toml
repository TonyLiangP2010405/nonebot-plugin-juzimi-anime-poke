[tool.poetry]
name = "nonebot-plugin-juzimi-anime-poke"
version = "0.1.0"
description = "NoneBot2 插件：当有人戳机器人时自动回复动漫语录，支持主动命令获取"
readme = "README.md"
license = "MIT"
authors = ["Tony <TonyLiangP2010405@gmail.com>"]
keywords = ["nonebot", "nonebot2", "plugin", "anime", "quote", "juzimi", "poke"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
packages = [{ include = "nonebot_plugin_juzimi_anime_poke" }]

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = ">=2.2.0"
nonebot-adapter-onebot = ">=2.4.0"
nonebot-plugin-localstore = ">=0.7.0"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
httpx = ">=0.25.0"
beautifulsoup4 = ">=4.12.0"
typing-extensions = ">=4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
nonebug = "^0.3"
ruff = "^0.6"

[project]
name = "nonebot-plugin-juzimi-anime-poke"
version = "0.1.0"
description = "NoneBot2 插件：当有人戳机器人时自动回复动漫语录"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Tony" },
]
keywords = ["nonebot", "nonebot2", "plugin", "anime", "quote", "juzimi", "poke"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2>=2.2.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-localstore>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "typing-extensions>=4.0.0",
]

[project.entry-points."nonebot.plugin"]
nonebot_plugin_juzimi_anime_poke = "nonebot_plugin_juzimi_anime_poke"

[tool.nonebot]
plugins = ["nonebot_plugin_juzimi_anime_poke"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F405"]
